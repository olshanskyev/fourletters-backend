app:
  version: "@project.version@"
server:
  port: 8080
  servlet:
    contextPath: /server/api/v1
  ssl:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  application:
    name: fourletters-server

  # PostgreSQL Configuration
  datasource:
    # reWriteBatchedInserts collapses a JDBC insert batch into one multi-row INSERT statement.
    url: jdbc:postgresql://localhost:5432/FOURLETTERS?reWriteBatchedInserts=true
    username: fourletters
    password: fourletters
    defaultSchema: FOURLETTERS
    hikari:
      pool-name: hikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # Surface unroutable (mandatory) publishes back to the Server so receipts for an offline
    # sender can be retained for /inbox pull; routable receipts (online sender) are not stored.
    publisher-returns: true
rest:
  cors:
    allowedOriginPatterns: "https://localhost, https://4t4074x4-4200.euw.devtunnels.ms"
  jwt:
    accessTokenValiditySec: 900
    refreshTokenValiditySec: 604800
    issuer: "fourletters"
    # private/public key paths for JWT signing (required)
    privateKeyPath: "classpath:certs/jwt/private_key.pem"
    publicKeyPath: "classpath:certs/jwt/public_key.pem"
google:
  clientId: "74177348869-n3k7043tjn1blpaluf67elnsb9ilmtr7.apps.googleusercontent.com"
# Shared secret a Hub must present (Authorization: Bearer) to register and be provisioned a relay queue.
hub:
  registration:
    secret: "dev-hub-registration-secret"
# Server-owned inbox
inbox:
  # Seconds a message is held in memory awaiting a receipt before it is flushed to PostgreSQL.
  hold-window-seconds: 30
  # How often the sweeper scans the hot tier for expired (unconfirmed) messages.
  flush-interval-ms: 5000
# Web Push (VAPID) — wakes an offline recipient. push is disabled (no-op) when the key pair is absent.
push:
  vapid:
    public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    # Contact URI required by the Web Push spec (mailto: or https:).
    subject: ${PUSH_VAPID_SUBJECT:mailto:olshanskyev@gmail.com}
  # At most one push per recipient within this window; further triggers are collapsed.
  debounce-seconds: 15
