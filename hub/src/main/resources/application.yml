app:
  version: "@project.version@"
server:
  port: 8081
  servlet:
    contextPath: /hub/api/v1
  ssl:
    enabled: false

# Shared configuration applied to every profile; the profile documents below only override
# the values that actually differ between environments.
spring:
  application:
    name: fourletters-hub

---
spring:
  config:
    activate:
      on-profile: default

  # RabbitMQ Configuration — the Hub connects with its own scoped user (bind + consume only).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_HUB_USER}
    password: ${RABBITMQ_HUB_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
rest:
  cors:
    allowedOriginPatterns: ${ALLOWED_ORIGIN_PATTERNS}
  jwt:
    issuer: ${JWT_ISSUER:fourletters}
    publicKeyUrl: ${JWT_PUBLIC_KEY_URL}
# Hub registration: on boot the Hub authenticates to the Server with this bearer token.
hub:
  registration:
    url: ${HUB_REGISTRATION_URL}
    token: ${HUB_REGISTRATION_TOKEN}

---
spring:
  config:
    activate:
      on-profile: local

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
rest:
  cors:
    allowedOriginPatterns: "https://localhost, https://4t4074x4-4200.euw.devtunnels.ms"
  jwt:
    issuer: "fourletters"
    publicKeyUrl: "https://4t4074x4-8080.euw.devtunnels.ms/server/api/v1/auth/jwks"
# Hub registration: on boot the Hub authenticates to the Server with this bearer token.
hub:
  registration:
    url: "https://4t4074x4-8080.euw.devtunnels.ms/server/api/v1/hubs/register"
    token: "dev-hub-registration-secret"
