app:
  version: "@project.version@"
server:
  port: 8081
  servlet:
    contextPath: /hub/api/v1
  ssl:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  application:
    name: fourletters-hub

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
rest:
  cors:
    allowedOriginPatterns: "https://localhost, https://4t4074x4-4200.euw.devtunnels.ms"
  jwt:
    issuer: "fourletters"
    publicKeyUrl: "https://4t4074x4-8080.euw.devtunnels.ms/server/api/v1/auth/jwks"
# Hub registration: on boot the Hub authenticates to the Server with this bearer token.
hub:
  registration:
    url: "https://4t4074x4-8080.euw.devtunnels.ms/server/api/v1/hubs/register"
    token: "dev-hub-registration-secret"
